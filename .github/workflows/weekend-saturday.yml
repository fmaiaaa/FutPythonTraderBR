name: Relatorio Semanal Sabado

on:
  schedule:
    # Sabado 07:00 America/Sao_Paulo (BRT) — GitHub cron em UTC
    - cron: "0 10 * * 6"
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: "1"
  TZ: America/Sao_Paulo

jobs:
  weekend-report:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Preparar diretorios de dados
        run: mkdir -p data/raw data/merged data/models data/weekend credentials

      - name: Restaurar cache modelos/dados
        uses: actions/cache@v4
        with:
          path: |
            data/models
            data/merged
            data/raw
          key: fpt-data-${{ hashFiles('fpt/catalog.json', 'fpt/leagues.py', 'config/models.yaml') }}-v3
          restore-keys: |
            fpt-data-

      - name: Configurar secrets
        env:
          FPT_KEY: ${{ secrets.FPT_API_KEY }}
          ODDS_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          GSA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          cat > .env <<EOF
          FPT_API_KEY=${FPT_KEY}
          THE_ODDS_API_KEY=${ODDS_KEY}
          THE_ODDS_MONTHLY_BUDGET=500
          GOOGLE_DRIVE_FOLDER=FutPythonTrader-Semanal
          GOOGLE_DRIVE_FOLDER_ID=${DRIVE_FOLDER_ID}
          LOG_LEVEL=INFO
          EOF
          if [ -n "$GSA_JSON" ]; then
            echo "$GSA_JSON" > credentials/google-service-account.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=credentials/google-service-account.json" >> .env
          fi
          if [ -z "$GSA_JSON" ]; then
            echo "::error::GOOGLE_SERVICE_ACCOUNT_JSON nao configurado nos Secrets"
            exit 1
          fi
          if [ -z "$DRIVE_FOLDER_ID" ]; then
            echo "::error::GOOGLE_DRIVE_FOLDER_ID nao configurado nos Secrets"
            exit 1
          fi

      - name: Atualizar dados FPT
        run: |
          if [ -f data/merged/brazil_male_all.parquet ] || [ -f data/merged/brazil_male_all.csv ]; then
            echo "Merged em cache — pulando download-weekly"
          else
            python main.py download-weekly || true
            python -c "from fpt.downloader import merge_all; merge_all(); print('merge OK')"
          fi

      - name: Treinar modelos (se ausentes)
        run: |
          if [ ! -f data/models/model_outcome.joblib ]; then
            python main.py treinar
          else
            echo "Modelo em cache"
          fi

      - name: Rotina fim de semana (sabado + domingo)
        run: python main.py fim-de-semana --no-train

      - name: Localizar pasta do relatorio
        id: paths
        run: |
          REPORT_DIR=$(find data/weekend -mindepth 2 -maxdepth 2 -type d | sort | tail -1)
          if [ -z "$REPORT_DIR" ]; then
            echo "::error::Nenhuma pasta data/weekend/YYYY-MM/YYYY-MM-DD encontrada"
            exit 1
          fi
          echo "report_dir=$REPORT_DIR" >> $GITHUB_OUTPUT
          echo "Pasta: $REPORT_DIR"
          ls -la "$REPORT_DIR"
          PDF_COUNT=$(find "$REPORT_DIR" -name '*.pdf' | wc -l)
          echo "PDFs: $PDF_COUNT"
          if [ "$PDF_COUNT" -eq 0 ]; then
            echo "::error::Nenhum PDF gerado"
            exit 1
          fi

      - name: Upload Google Drive
        env:
          REPORT_DIR: ${{ steps.paths.outputs.report_dir }}
        run: |
          SAT=$(basename "$REPORT_DIR")
          python scripts/upload_weekend_drive.py --dir "$REPORT_DIR" --date "$SAT"

      - name: Upload artefatos GitHub
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-semanal-${{ github.run_id }}
          path: |
            data/weekend/**/*.pdf
            data/weekend/**/*.csv
            data/weekend/**/*.txt
            data/weekend/**/drive_links.json
          retention-days: 90

      - name: Resumo
        run: |
          echo "=== Relatorio gerado ==="
          find data/weekend -name "*.pdf" | head -20
          if [ -f "${{ steps.paths.outputs.report_dir }}/drive_links.json" ]; then
            echo "=== drive_links.json ==="
            cat "${{ steps.paths.outputs.report_dir }}/drive_links.json"
          fi

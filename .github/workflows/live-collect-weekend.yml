name: Coleta Live Fim de Semana

on:
  schedule:
    # Sábado 14:00 BRT (17:00 UTC)
    - cron: "0 17 * * 6"
    # Domingo 14:00 BRT (17:00 UTC)
    - cron: "0 17 * * 0"
    # Finalização domingo 23:30 BRT (seg 02:30 UTC)
    - cron: "30 2 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "collect | finalize"
        required: true
        default: collect
        type: choice
        options:
          - collect
          - finalize
      duration_minutes:
        description: "Minutos de coleta (modo collect)"
        required: false
        default: "300"
        type: string

env:
  PYTHONUNBUFFERED: "1"
  TZ: America/Sao_Paulo
  FPT_PERSIST_LOCAL: "1"
  GITHUB_ACTIONS: "true"
  FPT_API_KEY: ${{ secrets.FPT_API_KEY }}

jobs:
  live-weekend:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Detectar modo (collect vs finalize)
        id: plan
        env:
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ -n "$INPUT_MODE" ]; then
            echo "mode=$INPUT_MODE" >> "$GITHUB_OUTPUT"
          else
            DOW=$(TZ=America/Sao_Paulo date +%u)
            if [ "$DOW" = "1" ]; then
              echo "mode=finalize" >> "$GITHUB_OUTPUT"
            else
              echo "mode=collect" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "Modo: $(cat $GITHUB_OUTPUT)"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Preparar diretorios
        run: mkdir -p data/{raw,merged,models,live_collection,betfair/ticks,sofascore,weekend} credentials certs

      - name: Restaurar cache coleta live
        uses: actions/cache@v4
        with:
          path: |
            data/live_collection
            data/betfair/ticks
            data/models/scalping
          key: fpt-live-collection-${{ github.run_number }}
          restore-keys: |
            fpt-live-collection-
            fpt-data-

      - name: Configurar secrets (FPT + Drive + Betfair)
        env:
          FPT_KEY: ${{ secrets.FPT_API_KEY }}
          OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          OAUTH_REFRESH: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GSA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          BF_USER: ${{ secrets.BETFAIR_USERNAME }}
          BF_PASS: ${{ secrets.BETFAIR_PASSWORD }}
          BF_KEY: ${{ secrets.BETFAIR_APP_KEY }}
          BF_CERT: ${{ secrets.BETFAIR_CERT_PEM }}
          BF_KEY_PEM: ${{ secrets.BETFAIR_KEY_PEM }}
        run: |
          cat > .env <<EOF
          FPT_API_KEY=${FPT_KEY}
          LOG_LEVEL=INFO
          EOF
          export GOOGLE_DRIVE_FOLDER_ID="$DRIVE_FOLDER_ID"
          export GOOGLE_OAUTH_CLIENT_ID="$OAUTH_CLIENT_ID"
          export GOOGLE_OAUTH_CLIENT_SECRET="$OAUTH_CLIENT_SECRET"
          export GOOGLE_OAUTH_REFRESH_TOKEN="$OAUTH_REFRESH"
          export GOOGLE_SERVICE_ACCOUNT_JSON="$GSA_JSON"
          bash scripts/github_setup_drive_env.sh || true
          export BETFAIR_USERNAME="$BF_USER"
          export BETFAIR_PASSWORD="$BF_PASS"
          export BETFAIR_APP_KEY="$BF_KEY"
          export BETFAIR_CERT_PEM="$BF_CERT"
          export BETFAIR_KEY_PEM="$BF_KEY_PEM"
          bash scripts/github_setup_betfair_env.sh || true

      - name: Dados merged (cache ou download)
        if: steps.plan.outputs.mode == 'collect'
        run: |
          if [ ! -f data/merged/brazil_male_all.parquet ] && [ ! -f data/merged/brazil_male_all.csv ]; then
            python main.py download-weekly || true
            python -c "from fpt.downloader import merge_all; merge_all()"
          fi
          if [ ! -f data/models/model_outcome.joblib ]; then
            python main.py treinar || true
          fi

      - name: Coleta minuto a minuto (odds + SofaScore)
        if: steps.plan.outputs.mode == 'collect'
        run: |
          DUR="${{ github.event.inputs.duration_minutes || '300' }}"
          python scripts/run_live_collector.py --minutes "$DUR" --interval 60

      - name: Finalizar semana (dataset + treino + Drive)
        if: steps.plan.outputs.mode == 'finalize'
        run: python scripts/finalize_weekly_collection.py --upload-drive

      - name: Salvar cache coleta
        if: steps.plan.outputs.mode == 'collect'
        uses: actions/cache/save@v4
        with:
          path: |
            data/live_collection
            data/betfair/ticks
          key: fpt-live-collection-${{ github.run_number }}

      - name: Upload artefatos
        uses: actions/upload-artifact@v4
        with:
          name: fpt-live-${{ steps.plan.outputs.mode }}-${{ github.run_id }}
          path: |
            data/live_collection/**/*
            data/models/scalping/**/*
          retention-days: 45
          if-no-files-found: ignore

      - name: Resumo
        run: |
          echo "Modo: ${{ steps.plan.outputs.mode }}"
          find data/live_collection -type f 2>/dev/null | head -20 || true
          ls -la data/models/scalping 2>/dev/null || true

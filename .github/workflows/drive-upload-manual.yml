name: Upload Drive (manual)

on:
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: "1"
  TZ: America/Sao_Paulo

jobs:
  drive-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Configurar secrets
        env:
          GSA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          mkdir -p credentials data/weekend
          cat > .env <<EOF
          GOOGLE_DRIVE_FOLDER=FutPythonTrader-Semanal
          GOOGLE_DRIVE_FOLDER_ID=${DRIVE_FOLDER_ID}
          EOF
          echo "$GSA_JSON" > credentials/google-service-account.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=credentials/google-service-account.json" >> .env

      - name: Baixar artefato do ultimo relatorio (se existir)
        continue-on-error: true
        run: |
          RUN_ID=$(gh run list --workflow=weekend-saturday.yml --limit 5 --json databaseId,conclusion -q '.[] | select(.conclusion=="failure" or .conclusion=="success") | .databaseId' | head -1)
          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" -D /tmp/artifact || true
            find /tmp/artifact -type f -name "*.pdf" -exec cp {} data/weekend/ \; 2>/dev/null || true
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verificar permissao Drive
        run: python scripts/verify_drive_access.py

      - name: Upload relatorio local ou artefato
        run: |
          REPORT_DIR=$(find data/weekend -mindepth 2 -maxdepth 2 -type d 2>/dev/null | sort | tail -1)
          if [ -z "$REPORT_DIR" ]; then
            echo "::error::Nenhuma pasta de relatorio. Rode o workflow Relatorio Semanal Sabado primeiro."
            exit 1
          fi
          SAT=$(basename "$REPORT_DIR")
          python scripts/upload_weekend_drive.py --dir "$REPORT_DIR" --date "$SAT"

name: Upload Drive (manual)

on:
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: "1"
  TZ: America/Sao_Paulo

jobs:
  drive-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Configurar secrets
        env:
          OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          OAUTH_REFRESH: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GSA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          mkdir -p credentials data/weekend
          export GOOGLE_OAUTH_CLIENT_ID="$OAUTH_CLIENT_ID"
          export GOOGLE_OAUTH_CLIENT_SECRET="$OAUTH_CLIENT_SECRET"
          export GOOGLE_OAUTH_REFRESH_TOKEN="$OAUTH_REFRESH"
          export GOOGLE_SERVICE_ACCOUNT_JSON="$GSA_JSON"
          export GOOGLE_DRIVE_FOLDER_ID="$DRIVE_FOLDER_ID"
          bash scripts/github_setup_drive_env.sh

      - name: Baixar artefato do ultimo relatorio semanal
        run: |
          RUN_ID=$(gh run list --workflow="Relatorio Semanal Sabado" --limit 15 \
            --json databaseId,conclusion \
            -q '.[] | select(.conclusion=="success") | .databaseId' | head -1)
          if [ -z "$RUN_ID" ]; then
            echo "::error::Nenhum workflow Relatorio Semanal Sabado concluido com sucesso."
            exit 1
          fi
          echo "Baixando artefato da run $RUN_ID"
          gh run download "$RUN_ID" -D /tmp/artifact
          mkdir -p data
          WEEKEND_SRC=""
          if compgen -G "/tmp/artifact/*/data/weekend" > /dev/null 2>&1; then
            WEEKEND_SRC=$(find /tmp/artifact -mindepth 1 -maxdepth 3 -type d -path '*/data/weekend' | head -1)
          elif [ -d /tmp/artifact/data/weekend ]; then
            WEEKEND_SRC="/tmp/artifact/data/weekend"
          fi
          if [ -z "$WEEKEND_SRC" ] || [ ! -d "$WEEKEND_SRC" ]; then
            echo "::error::Pasta data/weekend nao encontrada no artefato."
            find /tmp/artifact -type f | head -30
            exit 1
          fi
          cp -r "$WEEKEND_SRC" data/
          echo "Arquivos em data/weekend:"
          find data/weekend -type f | head -30
          PDF_COUNT=$(find data/weekend -name '*.pdf' | wc -l)
          if [ "$PDF_COUNT" -eq 0 ]; then
            echo "::error::Nenhum PDF no artefato baixado."
            exit 1
          fi
          echo "PDFs encontrados: $PDF_COUNT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verificar permissao Drive
        run: python scripts/verify_drive_access.py

      - name: Upload relatorio para Drive
        run: |
          REPORT_DIR=$(find data/weekend -mindepth 2 -maxdepth 2 -type d | sort | tail -1)
          if [ -z "$REPORT_DIR" ]; then
            echo "::error::Pasta de relatorio nao encontrada em data/weekend."
            find data/weekend -type d
            exit 1
          fi
          SAT=$(basename "$REPORT_DIR")
          echo "Upload: $REPORT_DIR (sabado $SAT)"
          python scripts/upload_weekend_drive.py --dir "$REPORT_DIR" --date "$SAT"

split:
  train_fraction: 0.70
  test_fraction: 0.30
  method: temporal_holdout
  cross_validation: TimeSeriesSplit
  production_fit: full_dataset_after_validation

feature_selection:
  enabled: true
  max_features: 80
  threshold: median

ensemble:
  voting: soft
  weights: [1, 1, 1]

  random_forest:
    n_estimators: 150
    max_depth: 5
    min_samples_leaf: 40
    max_features: sqrt
    class_weight: balanced_subsample

  hist_gbm:
    max_iter: 180
    learning_rate: 0.04
    max_depth: 4
    min_samples_leaf: 45
    l2_regularization: 8.0

  gbm:
    n_estimators: 120
    learning_rate: 0.04
    max_depth: 3
    min_samples_leaf: 45
    subsample: 0.65
    max_features: sqrt

calibration:
  method: isotonic
  cv_folds: 3

prediction:
  shrinkage_to_market: 0.40

evaluation:
  bankroll: 1000.0
  fixed_stakes_pct: [0.002, 0.005, 0.01, 0.02, 0.05, 0.10]
  min_history: 100

hierarchical:
  enabled: true
  min_samples_per_league: 500
  max_leagues: 40
  league_blend_weight: 0.55    # peso do modelo específico vs global

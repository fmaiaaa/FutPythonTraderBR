[theme]
base = "dark"
primaryColor = "#009739"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#1a1f2e"
textColor = "#fafafa"

[server]
headless = true
# App local (atalho desktop) — XSRF exige CORS=true; desligamos XSRF para localhost
enableCORS = true
enableXsrfProtection = false
port = 8501
address = "127.0.0.1"

[browser]
gatherUsageStats = false

[runner]
fastReruns = true
